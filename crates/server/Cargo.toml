[package]
name = "colang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "colang"

[[bin]]
name = "import_dict"
path = "src/bin/import_dict.rs"

[[bin]]
name = "words"
path = "src/bin/words.rs"

[[bin]]
name = "words_to_db"
path = "src/bin/words_to_db.rs"

[[bin]]
name = "tts_words"
path = "src/bin/tts_words.rs"

[dependencies]
argon2 = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
diesel = { workspace = true, features = [
    "postgres",
    "chrono",
    "uuid",
    "serde_json",
] }
diesel_migrations = { workspace = true }
deadpool = { workspace = true }
diesel-async = { workspace = true }
horme = { workspace = true }
dotenvy = { workspace = true }
figment = { workspace = true, features = ["env", "toml", "yaml", "json"] }
hex = { workspace = true }
itertools = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
salvo = { workspace = true, features = [
    "cors",
    "logging",
    "oapi",
    "compression",
    "rustls",
    "serve-static",
] }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }

# Outfox AI crates
outfox-zhipu = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
byteorder = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["form", "multipart", "stream"] }
futures-util = { workspace = true }
image = { workspace = true }
