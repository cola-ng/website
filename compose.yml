services:
  colang:
    build:
      context: .
      dockerfile: crates/server/Dockerfile
    ports:
      - "8119:8119"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/colang
      - JWT_SECRET=your_jwt_secret_key
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BIND_ADDR=0.0.0.0:8119
    depends_on:
      - db
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "5173:80"
    environment:
      - API_UPSTREAM=${API_UPSTREAM:-colang:8119}
    depends_on:
      - colang
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: colang
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - /data/colang/pgsql:/var/lib/postgresql/data
    ports:
      - "7654:5432"
    restart: unless-stopped
