name: CI Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev cmake
      - run: cargo fmt -p colang-front --check
      - run: cargo check --locked -p colang --bin colang
      - run: cargo test --locked -p colang --lib
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo install trunk --version 0.22.1 --locked
      - run: cargo test --locked -p colang-front
      - run: cargo clippy --locked -p colang-front --target wasm32-unknown-unknown -- -D warnings
      - run: trunk build --release --locked
        working-directory: front
  build-docker-image:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: colang:latest
