name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract WUI metadata (tags, labels) for Docker
        id: meta_wui
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY }}/colang/colang_wui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Log into registry ${{ vars.REGISTRY }}
        if: gitea.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push WUI Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./front/Dockerfile
          platforms: linux/amd64
          push: ${{ gitea.event_name != 'pull_request' }}
          tags: ${{ steps.meta_wui.outputs.tags }}
          labels: ${{ steps.meta_wui.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/colang/colang_wui:buildcache
          cache-to: ${{ gitea.event_name != 'pull_request' && format('type=registry,ref={0}/colang/colang_wui:buildcache,mode=max', vars.REGISTRY) || '' }}

      - name: Extract API metadata (tags, labels) for Docker
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY }}/colang/colang_api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./crates/server/Dockerfile
          platforms: linux/amd64
          push: ${{ gitea.event_name != 'pull_request' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/colang/colang_api:buildcache
          cache-to: ${{ gitea.event_name != 'pull_request' && format('type=registry,ref={0}/colang/colang_api:buildcache,mode=max', vars.REGISTRY) || '' }}
